<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContractorHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #000;
      color: #fff;
      overflow: hidden;
    }
    video.bg {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .overlay {
      position: fixed; inset: 0; z-index: 1;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.1) 45%,
        rgba(0,0,0,0.6) 100%
      );
    }
    .page {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      padding: 0 2.5rem;
    }
    @media (min-width: 768px)  { .page { padding: 0 3rem; } }
    @media (min-width: 1024px) { .page { padding: 0 4rem; } }

    nav { padding-top: 1.5rem; flex-shrink: 0; }
    .nav-bar {
      border-radius: 12px; padding: 0.5rem 1rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .nav-logo { font-size: 15px; font-weight: 600; letter-spacing: -0.04em; color: #fff; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: none; transition: color .2s; }
    .nav-links a:hover { color: #fff; }
    .nav-cta {
      background: #fff; color: #000;
      padding: 7px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      border: none; cursor: pointer; font-family: inherit;
      transition: opacity .2s;
    }
    .nav-cta:hover { opacity: .85; }

    .hero {
      flex: 1;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 3.5rem;
    }
    @media (min-width: 1024px) { .hero { padding-bottom: 4.5rem; } }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: flex-end;
      gap: 2rem;
    }

    .hero-h1 {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 400;
      line-height: 1.06;
      letter-spacing: -0.04em;
      color: #fff;
      margin-bottom: 1rem;
      text-shadow: 0 2px 24px rgba(0,0,0,0.7);
    }
    .char {
      display: inline-block;
      opacity: 0; transform: translateX(-18px);
      transition: opacity 500ms ease, transform 500ms ease;
    }
    .char.v { opacity: 1; transform: translateX(0); }

    .hero-sub {
      font-size: clamp(13px, 1.4vw, 16px);
      color: rgba(255,255,255,0.85);
      margin-bottom: 1.5rem;
      line-height: 1.7;
      max-width: 400px;
      opacity: 0; transition: opacity 1s ease;
      text-shadow: 0 1px 10px rgba(0,0,0,0.8);
    }
    .hero-sub.v { opacity: 1; }

    .hero-btns { display: flex; gap: 12px; opacity: 0; transition: opacity 1s ease; }
    .hero-btns.v { opacity: 1; }

    .btn-white {
      background: #fff; color: #000;
      padding: 11px 26px; border-radius: 8px;
      font-size: 14px; font-weight: 500;
      border: none; cursor: pointer; font-family: inherit;
      transition: background .2s;
    }
    .btn-white:hover { background: #f0f0f0; }

    .btn-glass {
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 11px 26px; border-radius: 8px;
      font-size: 14px; font-weight: 500;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      cursor: pointer; font-family: inherit;
      transition: background .2s, color .2s;
    }
    .btn-glass:hover { background: #fff; color: #000; }

    .hero-right {
      display: flex; align-items: flex-end; justify-content: flex-end;
      opacity: 0; transition: opacity 1s ease;
    }
    .hero-right.v { opacity: 1; }

    .hero-tag {
      border: 1px solid rgba(255,255,255,0.18);
      padding: 0.75rem 1.5rem; border-radius: 12px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .hero-tag p {
      font-size: clamp(14px, 1.8vw, 20px);
      font-weight: 300; color: #fff;
      letter-spacing: -0.01em;
    }

    .curtain {
      position: fixed; inset: 0; z-index: 100;
      background: #C4873A;
      transform: scaleY(0); transform-origin: bottom;
      pointer-events: none;
    }
    .curtain.active {
      animation: cc 0.6s cubic-bezier(0.77,0,0.175,1) forwards;
    }


    @media (max-width: 768px) {
    }

    @keyframes cc {
      0%    { transform: scaleY(0); transform-origin: bottom; }
      49.9% { transform: scaleY(1); transform-origin: bottom; }
      50%   { transform: scaleY(1); transform-origin: top; }
      100%  { transform: scaleY(0); transform-origin: top; }
    }

    /* ── MOBILE RESPONSIVE ── */
    @media (max-width: 768px) {
      /* NAV */
      .nav-bar { padding: 0.5rem 0.875rem; }
      .nav-links { display: none !important; }
      .nav-logo { font-size: 14px; }
      /* Keep nav-cta inside bar, right-aligned naturally */
      .nav-cta {
        padding: 7px 18px !important;
        font-size: 13px !important;
        border-radius: 100px !important;
      }

      /* PAGE PADDING */
      .page { padding: 0 1.25rem; }

      /* HERO GRID - stack vertically */
      .hero-grid {
        grid-template-columns: 1fr !important;
        gap: 1.25rem;
      }

      /* HEADING - prevent word break */
      .hero-h1 {
        font-size: clamp(2rem, 8vw, 3rem) !important;
        letter-spacing: -0.03em;
        word-break: keep-all;
        overflow-wrap: break-word;
      }

      /* SUBTEXT */
      .hero-sub {
        font-size: 14px !important;
        max-width: 100% !important;
      }

      /* BUTTONS */
      .hero-btns { gap: 10px; }
      .btn-white, .btn-glass {
        padding: 10px 18px !important;
        font-size: 13px !important;
      }

      /* RIGHT TAG - align left on mobile */
      .hero-right {
        justify-content: flex-start !important;
      }
      .hero-tag p {
        font-size: clamp(13px, 3.5vw, 16px) !important;
      }

      /* HERO BOTTOM PADDING */
      .hero { padding-bottom: 2.5rem !important; }

      /* NAV top padding */
      nav { padding-top: 1rem; }
    }

    @media (max-width: 480px) {
      .page { padding: 0 1rem; }
      .hero-h1 { font-size: clamp(1.75rem, 9vw, 2.5rem) !important; }
      .hero-btns { flex-direction: column; gap: 8px; }
      .btn-white, .btn-glass { width: 100%; text-align: center; }
    }

  </style>
</head>
